"none" stroke="#432747" stroke-width="5" stroke-linecap="round"/><path d="M214 183 Q235 166 254 181" fill="none" stroke="#432747" stroke-width="5" stroke-linecap="round"/><ellipse cx="169" cy="190" rx="12" ry="17" fill="#fff5ff"/><ellipse cx="232" cy="190" rx="12" ry="17" fill="#fff5ff"/><ellipse cx="169" cy="191" rx="8" ry="14" fill="#9866ff"/><ellipse cx="232" cy="191" rx="8" ry="14" fill="#9866ff"/><circle cx="171" cy="185" r="3" fill="white"/><circle cx="234" cy="185" r="3" fill="white"/></g><path d="M196 215 Q200 218 204 215" fill="none" stroke="#b87387" stroke-width="2"/><ellipse class="mouth" cx="200" cy="239" rx="10" ry="3.5" fill="#a75579"/><path d="M143 157 Q168 141 190 157 M209 157 Q230 141 254 157" stroke="#4b3066" stroke-width="4" fill="none" opacity=".7"/><path d="M152 319 L185 363 L200 347 L215 363 L247 319" stroke="#cba9ff" stroke-width="3" fill="none"/><circle cx="200" cy="379" r="12" fill="#cbb0ff"/><circle cx="200" cy="379" r="6" fill="#fff"/><path d="M110 365 Q84 376 77 410" fill="none" stroke="#8d6dc9" stroke-width="22" stroke-linecap="round"/><path d="M290 365 Q316 376 323 410" fill="none" stroke="#8d6dc9" stroke-width="22" stroke-linecap="round"/></g></svg><div class="status"><h2>VEXYRA</h2><p id="mood">✦ Aguardando sua mensagem</p></div><div class="controls"><button id="voice">🔊 Voz: ligada</button><button id="clear">↻ Nova conversa</button></div></section><section class="panel"><div class="panelhead">✧ CONEXÃO NEURAL <span style="float:right;color:#a78cda;font-size:12px">GPT-OSS</span></div><div class="messages" id="chat" aria-live="polite"></div><form class="composer" id="form"><input id="msg" autocomplete="off" placeholder="Converse com VEXYRA..." required><button class="send" id="send">Enviar ➜</button></form></section></div><div class="footer">VEXYRA 4.0 · Protótipo visual 2D · Desenvolvida por Matheus Henrique</div></main></div><script>
const API='https://vexyra-public.novin062m.workers.dev';const chat=document.getElementById('chat'),form=document.getElementById('form'),input=document.getElementById('msg'),send=document.getElementById('send'),stage=document.getElementById('stage'),mood=document.getElementById('mood');let voiceOn=true;let history=[];try{history=JSON.parse(localStorage.getItem('vexyra-v4-history')||'[]');if(!Array.isArray(history))history=[]}catch{history=[]}function clean(t){return String(t).replace(/\*/g,'')}function draw(t,role,save=true){let el=document.createElement('div');el.className='bubble '+(role==='user'?'user':'');el.textContent=clean(t);chat.appendChild(el);chat.scrollTop=chat.scrollHeight;if(save){history.push({t:clean(t),role});history=history.slice(-80);localStorage.setItem('vexyra-v4-history',JSON.stringify(history))}}if(history.length)history.forEach(x=>draw(x.t,x.role,false));else draw('Olá! Sou a VEXYRA. Vamos conversar? ✨','bot');function state(s){stage.classList.toggle('thinking',s==='thinking');stage.classList.toggle('speaking',s==='speaking');mood.textContent=s==='thinking'?'✦ Processando sua mensagem...':s==='speaking'?'✦ Falando com você...':'✦ Aguardando sua mensagem'}function speak(t){if(!voiceOn||!('speechSynthesis'in window))return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(clean(t));u.lang='pt-BR';u.rate=1.03;u.onstart=()=>state('speaking');u.onend=()=>state('idle');u.onerror=()=>state('idle');window.speechSynthesis.speak(u)}form.addEventListener('submit',async e=>{e.preventDefault();let t=input.value.trim();if(!t||send.disabled)return;draw(t,'user');input.value='';send.disabled=true;state('thinking');try{let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mensagem:t})});if(!r.ok)throw Error('HTTP '+r.status);let d=await r.json();let answer=d.resposta||d.erro||'Não consegui responder.';draw(answer,'bot');speak(answer)}catch(e){draw('Erro ao conectar: '+e.message,'bot')}finally{send.disabled=false;if(!window.speechSynthesis?.speaking)state('idle')}});document.getElementById('voice').onclick=e=>{voiceOn=!voiceOn;e.target.textContent=voiceOn?'🔊 Voz: ligada':'🔇 Voz: desligada';if(!voiceOn){speechSynthesis?.cancel();state('idle')}};document.getElementById('clear').onclick=()=>{history=[];localStorage.removeItem('vexyra-v4-history');chat.replaceChildren();draw('Nova conversa iniciada. ✨','bot');if('speechSynthesis'in window)speechSynthesis.cancel();state('idle')};
