<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXYRA 0.1</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        h1 {
            color: #a855f7;
            margin-bottom: 5px;
        }
        canvas {
            background: #111827;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
            margin-bottom: 15px;
        }
        #chat-container {
            width: 90%;
            max-width: 400px;
            background: #1f2937;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        input {
            padding: 10px;
            border-radius: 5px;
            border: none;
            outline: none;
            background: #374151;
            color: white;
        }
        button {
            padding: 10px;
            border-radius: 5px;
            border: none;
            background: #a855f7;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #9333ea;
        }
        #mensagens {
            max-height: 120px;
            overflow-y: auto;
            font-size: 14px;
            background: #111827;
            padding: 8px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h1>VEXYRA 0.1</h1>
    <p style="color: #9ca3af; font-size: 14px;">Personagem Viva & Conectada</p>

    <!-- Canvas da Personagem Viva (Animada, piscando e mexendo a boca) -->
    <canvas id="vexyraCanvas" width="180" height="180"></canvas>

    <div id="chat-container">
        <div id="mensagens"><b>VEXYRA 0.1:</b> Olá Matheus! Estou pronta.</div>
        <input type="text" id="userInput" placeholder="Digite algo para a Vexyra...">
        <button onclick="enviarMensagem()">Enviar</button>
    </div>

    <script>
        const canvas = document.getElementById('vexyraCanvas');
        const ctx = canvas.getContext('2d');

        let estaFalando = false;
        let bocaAberta = false;
        let olhosFechados = false;

        // Piscar automático
        setInterval(() => {
            olhosFechados = true;
            setTimeout(() => { olhosFechados = false; }, 150);
        }, 3000);

        // Mexer a boca ao falar
        setInterval(() => {
            if (estaFalando) {
                bocaAberta = !bocaAberta;
            } else {
                bocaAberta = false;
            }
        }, 150);

        function desenhar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Cabeça
            ctx.fillStyle = "#ffe0bd";
            ctx.beginPath();
            ctx.arc(90, 90, 55, 0, Math.PI * 2);
            ctx.fill();

            // Cabelo / Orelhas de Gato
            ctx.fillStyle = "#d8b4fe";
            ctx.beginPath(); ctx.moveTo(45, 55); ctx.lineTo(25, 20); ctx.lineTo(65, 40); ctx.fill();
            ctx.beginPath(); ctx.moveTo(135, 55); ctx.lineTo(155, 20); ctx.lineTo(115, 40); ctx.fill();

            // Olhos
            ctx.fillStyle = "#a855f7";
            if (olhosFechados) {
                ctx.fillRect(68, 85, 12, 2);
                ctx.fillRect(100, 85, 12, 2);
            } else {
                ctx.beginPath();
                ctx.arc(74, 85, 6, 0, Math.PI * 2);
                ctx.arc(106, 85, 6, 0, Math.PI * 2);
                ctx.fill();
            }

            // Boca
            ctx.fillStyle = "#e11d48";
            ctx.beginPath();
            if (bocaAberta) {
                ctx.arc(90, 110, 7, 0, Math.PI);
            } else {
                ctx.arc(90, 110, 4, 0, Math.PI);
            }
            ctx.fill();

            requestAnimationFrame(desenhar);
        }
        desenhar();

        function enviarMensagem() {
            const input = document.getElementById('userInput');
            const txt = input.value.trim();
            if(!txt) return;

            const box = document.getElementById('mensagens');
            box.innerHTML += `<br><b>Você:</b> ${txt}`;
            input.value = "";

            let resposta = "Entendido! Estou processando sua solicitação.";
            if(txt.toLowerCase().includes("olá") || txt.toLowerCase().includes("oi")) {
                resposta = "Oi Matheus! Como posso ajudar na Vexyra 0.1?";
            }

            box.innerHTML += `<br><b>VEXYRA:</b> ${resposta}`;
            box.scrollTop = box.scrollHeight;

            // Ativa animação da boca e voz
            falar(resposta);
        }

        function falar(texto) {
            estaFalando = true;
            const synth = window.speechSynthesis;
            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'pt-BR';
            utterance.onend = () => { estaFalando = false; };
            synth.speak(utterance);
        }
    </script>
</body>
</html>
