<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXYRA 0.1</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; padding: 20px; }
        h1 { color: #a855f7; margin-bottom: 5px; font-size: 24px; }
        p { color: #9ca3af; font-size: 14px; margin-bottom: 15px; }
        canvas { background: #111827; border-radius: 12px; box-shadow: 0 0 20px rgba(168, 85, 247, 0.3); margin-bottom: 15px; }
        #chat-container { width: 100%; max-width: 400px; background: #1f2937; padding: 15px; border-radius: 10px; display: flex; flex-direction: column; gap: 10px; }
        input { padding: 12px; border-radius: 5px; border: none; outline: none; background: #374151; color: white; font-size: 14px; }
        button { padding: 12px; border-radius: 5px; border: none; background: #a855f7; color: white; font-weight: bold; cursor: pointer; font-size: 14px; }
        button:hover { background: #9333ea; }
        #mensagens { height: 150px; overflow-y: auto; font-size: 14px; background: #111827; padding: 10px; border-radius: 5px; display: flex; flex-direction: column; gap: 6px; }
    </style>
</head>
<body>

    <h1>VEXYRA 0.1</h1>
    <p>Personagem Viva & Conectada</p>

    <canvas id="vexyraCanvas" width="160" height="160"></canvas>

    <div id="chat-container">
        <div id="mensagens"><div><b>VEXYRA 0.1:</b> Olá Matheus! Estou pronta para conversar e calcular.</div></div>
        <input type="text" id="userInput" placeholder="Digite uma mensagem ou cálculo..." onkeypress="if(event.key==='Enter') enviarMensagem()">
        <button onclick="enviarMensagem()">Enviar</button>
    </div>

    <script>
        const canvas = document.getElementById('vexyraCanvas');
        const ctx = canvas.getContext('2d');

        let estaFalando = false;
        let bocaAberta = false;
        let olhosFechados = false;

        setInterval(() => {
            olhosFechados = true;
            setTimeout(() => { olhosFechados = false; }, 150);
        }, 3000);

        setInterval(() => {
            if (estaFalando) {
                bocaAberta = !bocaAberta;
            } else {
                bocaAberta = false;
            }
        }, 150);

        function desenhar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Cabeça
            ctx.fillStyle = "#ffe0bd";
            ctx.beginPath();
            ctx.arc(80, 80, 50, 0, Math.PI * 2);
            ctx.fill();

            // Orelhas de Gato
            ctx.fillStyle = "#d8b4fe";
            ctx.beginPath(); ctx.moveTo(40, 50); ctx.lineTo(20, 15); ctx.lineTo(60, 35); ctx.fill();
            ctx.beginPath(); ctx.moveTo(120, 50); ctx.lineTo(140, 15); ctx.lineTo(100, 35); ctx.fill();

            // Olhos
            ctx.fillStyle = "#a855f7";
            if (olhosFechados) {
                ctx.fillRect(60, 75, 10, 2);
                ctx.fillRect(90, 75, 10, 2);
            } else {
                ctx.beginPath();
                ctx.arc(65, 75, 5, 0, Math.PI * 2);
                ctx.arc(95, 75, 5, 0, Math.PI * 2);
                ctx.fill();
            }

            // Boca
            ctx.fillStyle = "#e11d48";
            ctx.beginPath();
            if (bocaAberta) {
                ctx.arc(80, 100, 6, 0, Math.PI);
            } else {
                ctx.arc(80, 100, 3, 0, Math.PI);
            }
            ctx.fill();

            requestAnimationFrame(desenhar);
        }
        desenhar();

        function enviarMensagem() {
            const input = document.getElementById('userInput');
            const txt = input.value.trim();
            if(!txt) return;

            const box = document.getElementById('mensagens');
            box.innerHTML += `<div><b>Você:</b> ${txt}</div>`;
            input.value = "";
            box.scrollTop = box.scrollHeight;

            let resposta = "";

            try {
                if (/^[0-9+\-*/().\s]+$/.test(txt)) {
                    let res = eval(txt);
                    resposta = `O resultado do cálculo é ${res}.`;
                }
            } catch(e) {}

            if (!resposta) {
                const lower = txt.toLowerCase();
                if(lower.includes("olá") || lower.includes("oi")) {
                    resposta = "Oi Matheus! Tudo bem?";
                } else {
                    resposta = `Entendido! Processando: "${txt}".`;
                }
            }

            box.innerHTML += `<div><b>VEXYRA:</b> ${resposta}</div>`;
            box.scrollTop = box.scrollHeight;
            falar(resposta);
        }

        function falar(texto) {
            estaFalando = true;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(texto);
                utterance.lang = 'pt-BR';
                utterance.onend = () => { estaFalando = false; };
                window.speechSynthesis.speak(utterance);
            } else {
                setTimeout(() => { estaFalando = false; }, 2000);
            }
        }
    </script>
</body>
</html>
