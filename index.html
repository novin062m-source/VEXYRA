<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VEXYRA 0.1</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #06090f; color: #f8fafc; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* Topo Móvel */
        .header-bar { background: #0b0f17; border-bottom: 1px solid #1e293b; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .logo-title { font-size: 16px; font-weight: bold; color: #a855f7; display: flex; align-items: center; gap: 8px; }
        .status-badge { font-size: 10px; background: rgba(34,197,94,0.15); color: #22c55e; border: 1px solid rgba(34,197,94,0.3); padding: 3px 8px; border-radius: 12px; }

        /* Áreas Principais Divididas em Abas ou Módulo Flex */
        .app-container { flex: 1; display: flex; flex-direction: column; overflow-y: auto; position: relative; }

        /* Banner da Personagem Viva VRChat / Anime HQ */
        .character-card { position: relative; width: 100%; height: 320px; background: #0f172a; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; }
        .char-img { width: 100%; height: 100%; object-fit: cover; object-position: top center; transition: all 0.4s ease; filter: brightness(0.95); }
        .char-overlay { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, rgba(6,9,15,1) 0%, rgba(6,9,15,0.4) 60%, transparent 100%); padding: 15px; display: flex; flex-direction: column; gap: 6px; }
        .speech-bubble { background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(168, 85, 247, 0.4); padding: 10px 14px; border-radius: 12px; font-size: 12px; color: #e2e8f0; backdrop-filter: blur(8px); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }

        /* Painel de Controle de Personalização */
        .controls-panel { background: #0b0f17; border-top: 1px solid #1e293b; border-bottom: 1px solid #1e293b; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
        .panel-label { font-size: 10px; color: #64748b; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px; }
        .buttons-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
        .btn-opt { background: #111827; border: 1px solid #1f2937; color: #cbd5e1; padding: 8px 14px; border-radius: 8px; font-size: 11px; font-weight: 600; white-space: nowrap; cursor: pointer; transition: 0.2s; }
        .btn-opt:active, .btn-opt.active { background: #2e1065; border-color: #a855f7; color: #c084fc; }

        /* Seção do Chat */
        .chat-container { flex: 1; min-height: 250px; background: #06090f; display: flex; flex-direction: column; }
        .messages-list { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 14px; border-radius: 10px; font-size: 13px; max-width: 85%; line-height: 1.4; }
        .msg.vexyra { background: #111827; border: 1px solid #1f2937; align-self: flex-start; color: #f1f5f9; border-left: 3px solid #a855f7; }
        .msg.user { background: #1e1b4b; border: 1px solid #312e81; align-self: flex-end; color: #e2e8f0; }

        /* Input do Chat */
        .input-bar { padding: 10px 12px; background: #0b0f17; border-top: 1px solid #1e293b; display: flex; gap: 8px; align-items: center; }
        .input-bar input { flex: 1; background: #111827; border: 1px solid #374151; padding: 10px 14px; border-radius: 8px; color: white; outline: none; font-size: 13px; }
        .input-bar button { background: #7c3aed; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header-bar">
        <div class="logo-title">VEXYRA 0.1</div>
        <div class="status-badge">● Online</div>
    </div>

    <div class="app-container">
        <!-- Visualização da Personagem VRChat Realista -->
        <div class="character-card">
            <img id="vAvatar" class="char-img" src="https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?q=80&w=1000&auto=format&fit=crop" alt="Vexyra">
            <div class="char-overlay">
                <div class="speech-bubble" id="vBubble">Oi Matheus! Estou pronta. Escolha uma pose abaixo ou digite no chat! ✨</div>
            </div>
        </div>

        <!-- Painel de Controles e Poses Funcionais -->
        <div class="controls-panel">
            <div class="panel-label">Animações & Poses</div>
            <div class="buttons-row">
                <button class="btn-opt active" onclick="setPose('sentada', this)">🪑 Sentada</button>
                <button class="btn-opt" onclick="setPose('pe', this)">🚶 De Pé</button>
                <button class="btn-opt" onclick="setPose('deitada', this)">🛋️ Deitada</button>
                <button class="btn-opt" onclick="setPose('danca', this)">💃 Dançar</button>
            </div>

            <div class="panel-label">Expressões Faciais</div>
            <div class="buttons-row">
                <button class="btn-opt" onclick="setExpression('feliz', this)">😊 Feliz</button>
                <button class="btn-opt" onclick="setExpression('piscando', this)">😉 Piscar</button>
                <button class="btn-opt" onclick="setExpression('brava', this)">😠 Brava</button>
            </div>
        </div>

        <!-- Lista do Chat -->
        <div class="chat-container">
            <div class="messages-list" id="msgBox">
                <div class="msg vexyra"><b>VEXYRA 0.1:</b> Conectada! Como posso te ajudar hoje?</div>
            </div>

            <div class="input-bar">
                <input type="text" id="userInput" placeholder="Digite uma mensagem..." onkeypress="if(event.key==='Enter') sendMsg()">
                <button onclick="sendMsg()">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        const avatar = document.getElementById('vAvatar');
        const bubble = document.getElementById('vBubble');
        const msgBox = document.getElementById('msgBox');

        // Poses com imagens de alta definição
        const poses = {
            'sentada': 'https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?q=80&w=1000&auto=format&fit=crop',
            'pe': 'https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=1000&auto=format&fit=crop',
            'deitada': 'https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=1000&auto=format&fit=crop',
            'danca': 'https://images.unsplash.com/photo-1563089145-599997674d42?q=80&w=1000&auto=format&fit=crop'
        };

        function setPose(tipo, btn) {
            setActive(btn);
            if(poses[tipo]) {
                avatar.src = poses[tipo];
                let txt = "Pose alterada para: " + tipo;
                bubble.innerText = txt;
                speak(txt);
            }
        }

        function setExpression(expr, btn) {
            setActive(btn);
            let txt = "Mudando expressão para: " + expr;
            bubble.innerText = txt;
            speak(txt);
        }

        function setActive(btn) {
            if(!btn) return;
            const parent = btn.parentElement;
            parent.querySelectorAll('.btn-opt').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function sendMsg() {
            const input = document.getElementById('userInput');
            const txt = input.value.trim();
            if(!txt) return;

            // Insere mensagem do usuário
            msgBox.innerHTML += `<div class="msg user"><b>Você:</b> ${txt}</div>`;
            input.value = "";
            msgBox.scrollTop = msgBox.scrollHeight;

            // Resposta automática com fala
            setTimeout(() => {
                let reply = "Entendido, Matheus! Processando comando.";
                const lower = txt.toLowerCase();

                if(lower.includes("olá") || lower.includes("oi")) reply = "Oi Matheus! Tudo bem?";
                else if(lower.includes("senta") || lower.includes("sentada")) {
                    reply = "Sentei! Como estou?";
                    setPose('sentada', null);
                } else if(lower.includes("dança") || lower.includes("dançar")) {
                    reply = "Olha os meus movimentos!";
                    setPose('danca', null);
                }

                msgBox.innerHTML += `<div class="msg vexyra"><b>VEXYRA:</b> ${reply}</div>`;
                bubble.innerText = reply;
                msgBox.scrollTop = msgBox.scrollHeight;
                speak(reply);
            }, 500);
        }

        function speak(texto) {
            if('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(texto);
                utter.lang = 'pt-BR';
                window.speechSynthesis.speak(utter);
            }
        }
    </script>
</body>
</html>
